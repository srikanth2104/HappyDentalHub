<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Happy Dental Hub</title>
    <link rel="stylesheet" href="H1.css">
    <style>
        .auth-wrap { max-width: 460px; margin: 2rem auto; }
        .auth-card {
            background: var(--white, #fff);
            padding: 2rem;
            border-radius: var(--border-radius, 12px);
            box-shadow: var(--shadow, 0 4px 12px rgba(0,0,0,.1));
        }
        .auth-card h2 { text-align: center; color: #2c7a7b; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: .5rem; font-weight: 600; }
        .form-group input {
            width: 100%; padding: .75rem; border: 2px solid #e2e8f0;
            border-radius: 8px; font-size: 1rem; transition: border-color .3s ease;
        }
        .form-group input:focus { outline: none; border-color: #2c7a7b; }
        .auth-msg { display: none; padding: 10px 14px; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
        .auth-msg.error { background: #f8d7da; color: #721c24; }
        .auth-msg.ok { background: #d4edda; color: #155724; }
        .auth-link { text-align: center; margin-top: 1rem; }
        .auth-link a { color: #2c7a7b; font-weight: 600; }
    </style>
</head>
<body>
    <header class="header" style="background-color: white;">
        <div class="container">
            <div class="header-content">
                <a href="Happy.html" class="logo" style="color: #2c7a7b;font-size: 40px">🦷 Happy Dental Hub</a>
            </div>
        </div>
    </header>

    <nav class="nav">
        <div class="container">
            <ul class="nav-list">
                <li><a href="Happy.html" class="nav-link">🏠 Home</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <main class="content">
            <div class="auth-wrap">
                <section class="auth-card">
                    <h2>🔑 Login</h2>
                    <div id="msg" class="auth-msg"></div>

                    <form action="login" method="post">
                        <input type="hidden" id="next" name="next">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn" style="width: 100%;">Login</button>
                    </form>

                    <p class="auth-link">New here? <a href="register.html">Create an account</a></p>
                </section>
            </div>
        </main>
    </div>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2024 Happy Dental Hub. All rights reserved. | 🦷 Live long life with small smile</p>
        </div>
    </footer>

<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("next").value = params.get("next") || "";
    const box = document.getElementById("msg");
    if (params.get("error")) {
        box.textContent = params.get("error");
        box.className = "auth-msg error";
        box.style.display = "block";
    } else if (params.get("registered")) {
        box.textContent = "Registration successful! Please log in.";
        box.className = "auth-msg ok";
        box.style.display = "block";
    }
</script>
</body>
</html>
